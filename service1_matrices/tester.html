<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test du service matrices</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #5f6c7b;
      --line: #d8dee6;
      --primary: #1266d6;
      --primary-dark: #0d4fa8;
      --ok: #147d3f;
      --error: #b3261e;
      --code: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 24px auto;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      padding: 16px;
      margin-bottom: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    input {
      min-width: min(420px, 100%);
    }

    textarea {
      min-height: 138px;
      resize: vertical;
      font-family: Consolas, Monaco, monospace;
      font-size: 14px;
      line-height: 1.4;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 11px 14px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button.secondary {
      background: #eef3f8;
      color: var(--text);
      border: 1px solid var(--line);
    }

    button.secondary:hover {
      background: #e1e8f0;
    }

    .routes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 16px;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .route-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 4px;
      font-size: 18px;
    }

    code {
      color: var(--primary-dark);
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
    }

    .route-body {
      display: grid;
      gap: 12px;
      padding: 16px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    pre {
      min-height: 96px;
      margin: 0;
      padding: 12px;
      overflow: auto;
      border-radius: 6px;
      background: var(--code);
      color: #e5e7eb;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .status {
      font-weight: 700;
    }

    .status.ok {
      color: var(--ok);
    }

    .status.error {
      color: var(--error);
    }
  </style>
</head>
<body>
  <header>
    <h1>Test du service matrices</h1>
    <p>Page de test des routes Flask définies dans <code>service1_matrices/app.py</code>.</p>
  </header>

  <main>
    <div class="toolbar">
      <label>
        URL du service
        <input id="base-url" value="" placeholder="http://localhost:5001">
      </label>
      <button id="run-all">Tester toutes les routes</button>
      <button id="reset" class="secondary">Réinitialiser les exemples</button>
    </div>

    <div id="routes" class="routes"></div>
  </main>

  <script>
    const examples = [
      {
        title: 'Addition',
        method: 'POST',
        path: '/matrices/add',
        body: {
          A: [[1, 2], [3, 4]],
          B: [[5, 6], [7, 8]]
        }
      },
      {
        title: 'Multiplication',
        method: 'POST',
        path: '/matrices/multiply',
        body: {
          A: [[1, 2], [3, 4]],
          B: [[5, 6], [7, 8]]
        }
      },
      {
        title: 'Transposée',
        method: 'POST',
        path: '/matrices/transpose',
        body: {
          A: [[1, 2, 3], [4, 5, 6]]
        }
      },
      {
        title: 'Déterminant',
        method: 'POST',
        path: '/matrices/determinant',
        body: {
          A: [[1, 2], [3, 4]]
        }
      },
      {
        title: 'Inverse',
        method: 'POST',
        path: '/matrices/inverse',
        body: {
          A: [[1, 2], [3, 4]]
        }
      }
    ];

    const routeContainer = document.querySelector('#routes');
    const baseUrlInput = document.querySelector('#base-url');

    function initialBaseUrl() {
      if (location.protocol === 'http:' || location.protocol === 'https:') {
        return location.origin;
      }
      return 'http://localhost:5001';
    }

    function formatJson(value) {
      return JSON.stringify(value, null, 2);
    }

    function resetExamples() {
      document.querySelectorAll('[data-json]').forEach((textarea, index) => {
        textarea.value = formatJson(examples[index].body);
      });
      document.querySelectorAll('[data-result]').forEach((result) => {
        result.textContent = 'Aucun test lancé.';
      });
      document.querySelectorAll('[data-status]').forEach((status) => {
        status.textContent = '';
        status.className = 'status';
      });
    }

    function renderRoutes() {
      routeContainer.innerHTML = examples.map((route, index) => `
        <section>
          <div class="route-head">
            <div>
              <h2>${route.title}</h2>
              <code>${route.method} ${route.path}</code>
            </div>
            <span class="status" data-status="${index}"></span>
          </div>
          <div class="route-body">
            <label>
              Corps JSON
              <textarea data-json="${index}" spellcheck="false">${formatJson(route.body)}</textarea>
            </label>
            <div class="actions">
              <button data-test="${index}">Tester cette route</button>
              <button class="secondary" data-copy="${index}">Copier le JSON</button>
            </div>
            <pre data-result="${index}">Aucun test lancé.</pre>
          </div>
        </section>
      `).join('');
    }

    function serviceUrl(path) {
      const base = baseUrlInput.value.trim().replace(/\/$/, '');
      return `${base}${path}`;
    }

    async function testRoute(index) {
      const route = examples[index];
      const textarea = document.querySelector(`[data-json="${index}"]`);
      const result = document.querySelector(`[data-result="${index}"]`);
      const status = document.querySelector(`[data-status="${index}"]`);

      status.textContent = 'En cours';
      status.className = 'status';
      result.textContent = '';

      let payload;
      try {
        payload = JSON.parse(textarea.value);
      } catch (error) {
        status.textContent = 'JSON invalide';
        status.className = 'status error';
        result.textContent = error.message;
        return;
      }

      try {
        const response = await fetch(serviceUrl(route.path), {
          method: route.method,
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        const contentType = response.headers.get('content-type') || '';
        const data = contentType.includes('application/json')
          ? await response.json()
          : await response.text();

        status.textContent = `${response.status} ${response.statusText || ''}`.trim();
        status.className = response.ok ? 'status ok' : 'status error';
        result.textContent = typeof data === 'string' ? data : formatJson(data);
      } catch (error) {
        status.textContent = 'Erreur réseau';
        status.className = 'status error';
        result.textContent = [
          error.message,
          '',
          'Vérifiez que le service Flask est lancé sur le port 5001.'
        ].join('\n');
      }
    }

    routeContainer.addEventListener('click', async (event) => {
      const testButton = event.target.closest('[data-test]');
      const copyButton = event.target.closest('[data-copy]');

      if (testButton) {
        await testRoute(Number(testButton.dataset.test));
      }

      if (copyButton) {
        const index = Number(copyButton.dataset.copy);
        const textarea = document.querySelector(`[data-json="${index}"]`);
        await navigator.clipboard.writeText(textarea.value);
      }
    });

    document.querySelector('#run-all').addEventListener('click', async () => {
      for (let index = 0; index < examples.length; index += 1) {
        await testRoute(index);
      }
    });

    document.querySelector('#reset').addEventListener('click', resetExamples);

    baseUrlInput.value = initialBaseUrl();
    renderRoutes();
  </script>
</body>
</html>
